services:
  web:
    image: node:22
    working_dir: /app
    # Bind-mount the cloned source so edits hot-reload through Vite.
    volumes:
      - ./:/app
      # Keep installed deps out of the host repo and persistent across restarts.
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Lets Vite accept the preview's external hostname (set by the platform).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    # Install deps then start the Vite dev server (live reload).
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

volumes:
  node_modules:
